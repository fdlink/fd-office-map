<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>On the floor</title>
  <link rel="stylesheet" href="panel.css">
  <script src="https://play.workadventu.re/iframe_api.js"></script>
  <script src="loop.js"></script>
</head>
<body>
  <h1>On the floor</h1>
  <p id="flavor"></p>
  <p id="for-you" class="gift"></p>
  <div id="out">Loading the floor…</div>
  <button type="button" class="primary" id="export">Export Gate A log</button>
  <script>
    var L = window.FdOfficeLoop;
    var GLYPH = { deep: "◇", fire: "△", calm: "○", build: "□" };
    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function readLog() {
      try { return L.parseJsonSafe(WA.state.loadVariable("gateA"), []); } catch (e) { return []; }
    }
    function readNotes() {
      try { return L.parseJsonSafe(WA.state.loadVariable("boardNotes"), []); } catch (e) { return []; }
    }
    function card(name, st) {
      var hidden = st.hidden === true || st.hidden === "true";
      var pub = L.publicCard(hidden, st.scene, st.onNow, st.next, st.publishNext === true || st.publishNext === "true");
      return {
        name: name || "Someone",
        plaque: st.plaque || "",
        onNow: pub.onNow,
        next: pub.next,
        scene: pub.scene,
        closeLine: st.closedDay === L.todayKey() ? (st.closeLine || "") : ""
      };
    }
    function render() {
      var today = L.todayKey();
      var surprise = L.surpriseForDay(today);
      var opener = {};
      try { opener = L.parseJsonSafe(WA.state.loadVariable("opener"), {}); } catch (e) {}
      var opened = opener && opener.day === today && opener.name ? opener.name + " opened the office. " : "";
      document.getElementById("flavor").textContent = opened + surprise.line;

      var mine = L.notesForYou(readNotes(), WA.player.name || "");
      document.getElementById("for-you").textContent = mine.length
        ? "For you: " + mine[mine.length - 1].text
        : "";

      var rows = [card(WA.player.name, WA.player.state)];
      try {
        WA.players.list().forEach(function (p) { rows.push(card(p.name, p.state)); });
      } catch (e) {}
      var html = "<ul>" + rows.map(function (r) {
        var g = r.scene && GLYPH[r.scene] ? GLYPH[r.scene] + " " : "";
        var mark = r.plaque ? " · " + esc(r.plaque) : "";
        var line = r.closeLine
          ? '<span style="color:#e2b25c">closed · ' + esc(r.closeLine) + "</span>"
          : r.onNow ? esc(r.onNow) : r.next ? '<span style="color:#b7c9a8">next · ' + esc(r.next) + "</span>"
          : '<span style="color:#8b95a8">no card yet</span>';
        return "<li><strong>" + g + esc(r.name) + mark + "</strong><br>" + line + "</li>";
      }).join("") + "</ul>";
      var log = readLog();
      var names = {};
      log.forEach(function (r) { if (r.name) names[r.name] = true; });
      var crew = Math.max(1, Object.keys(names).length);
      var two = L.gateATwoWeeks(log, crew, today);
      var both = L.gateAToday(log, today).closed;
      html += '<p class="foot">Today ' + both + " closed the day · two-week Gate A " +
              two.passedDays + "/8 weekdays (need 8 of 10, 60% of " + crew +
              ").<br>Presence is not productivity.</p>";
      document.getElementById("out").innerHTML = html;
    }
    WA.onInit().then(function () {
      try { WA.players.configureTracking({ players: true, movement: false }); } catch (e) {}
      render();
      setInterval(render, 2000);
      document.getElementById("export").onclick = function () {
        var blob = new Blob([JSON.stringify({
          exported: new Date().toISOString(),
          source: "workadventure stage 0",
          log: readLog(),
          boardNotes: readNotes(),
          surprise: L.surpriseForDay(L.todayKey())
        }, null, 2)], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "fd-office-gate-a-" + L.todayKey() + ".json";
        a.click();
      };
    });
  </script>
</body>
</html>
