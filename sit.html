<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sit down</title>
  <link rel="stylesheet" href="panel.css">
  <script src="https://play.workadventu.re/iframe_api.js"></script>
  <script src="loop.js"></script>
</head>
<body>
  <h1>Sit down</h1>
  <p>Write what you are on. The scene is a mood; the sentence is yours.</p>
  <p id="gift" class="gift"></p>
  <label>Desk mark</label>
  <input id="plaque" maxlength="16" placeholder="this desk today (optional)">
  <label>Scene</label>
  <select id="scene">
    <option value="deep">◇ Deep work</option>
    <option value="fire">△ Firefighting</option>
    <option value="calm" selected>○ Steady</option>
    <option value="build">□ Building</option>
  </select>
  <label>On now</label>
  <input id="onNow" maxlength="80" placeholder="e.g. FD Office Stage 0">
  <label>Next</label>
  <input id="next" maxlength="80" placeholder="optional">
  <label><input type="checkbox" id="pubnext"> Show next on my desk</label>
  <label><input type="checkbox" id="hidden"> Hide status from others</label>
  <div class="row">
    <button type="button" class="ghost" id="cancel">Stay standing</button>
    <button type="button" class="primary" id="sit">Sit</button>
  </div>
  <script>
    var L = window.FdOfficeLoop;
    function loadNotes() {
      try { return L.parseJsonSafe(WA.state.loadVariable("boardNotes"), []); } catch (e) { return []; }
    }
    WA.onInit().then(function () {
      var st = WA.player.state;
      if (st.scene) document.getElementById("scene").value = st.scene;
      if (st.onNow) document.getElementById("onNow").value = st.onNow;
      if (st.nextPrivate) document.getElementById("next").value = st.nextPrivate;
      else if (st.next) document.getElementById("next").value = st.next;
      if (st.plaque) document.getElementById("plaque").value = st.plaque;
      document.getElementById("pubnext").checked = st.publishNext === true || st.publishNext === "true";
      document.getElementById("hidden").checked = st.hidden === true || st.hidden === "true";
      var mine = L.notesForYou(loadNotes(), WA.player.name || "");
      if (mine.length) {
        document.getElementById("gift").textContent = "On the board for you: " + mine[mine.length - 1].text;
      }
    });
    document.getElementById("cancel").onclick = function () { WA.ui.modal.closeModal(); };
    document.getElementById("sit").onclick = function () {
      var onNow = L.clipLine(document.getElementById("onNow").value, 80);
      var hidden = document.getElementById("hidden").checked;
      var allowed = L.sitAllowed(WA.player.name || "You", onNow, hidden);
      if (!allowed.ok) {
        document.getElementById("onNow").focus();
        return;
      }
      var scene = document.getElementById("scene").value;
      var next = L.clipLine(document.getElementById("next").value, 80);
      var plaque = L.clipLine(document.getElementById("plaque").value, 16);
      var publishNext = document.getElementById("pubnext").checked;
      var card = L.publicCard(hidden, scene, onNow, next, publishNext);
      WA.player.state.saveVariable("scene", card.scene, { public: true, persist: true });
      WA.player.state.saveVariable("onNow", card.onNow, { public: true, persist: true });
      WA.player.state.saveVariable("nextPrivate", next, { public: false, persist: true });
      WA.player.state.saveVariable("next", card.next, { public: true, persist: true });
      WA.player.state.saveVariable("publishNext", publishNext, { public: false, persist: true });
      WA.player.state.saveVariable("plaque", plaque, { public: true, persist: true });
      WA.player.state.saveVariable("hidden", hidden, { public: false, persist: true });
      WA.player.state.saveVariable("arrivedDay", L.todayKey(), { public: false, persist: true });
      WA.player.state.saveVariable("left", false, { public: true, persist: true });
      WA.chat.sendChatMessage(hidden ? "sat down (hidden)" : ("sat down · " + scene + (onNow ? " · " + onNow : "")), "FD Office");
      WA.ui.modal.closeModal();
    };
  </script>
</body>
</html>
