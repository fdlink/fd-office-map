<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Door</title>
  <link rel="stylesheet" href="panel.css">
  <script src="https://play.workadventu.re/iframe_api.js"></script>
  <script src="loop.js"></script>
</head>
<body>
  <h1>Door — close the day</h1>
  <p>One line. This is the save. Walking out is the ceremony.</p>
  <p id="together"></p>
  <label>What shipped</label>
  <textarea id="line" maxlength="160" placeholder="Shipped the Stage 0 map"></textarea>
  <label>Leave a line for someone (optional)</label>
  <div class="split">
    <input id="gift-to" maxlength="24" placeholder="their name">
    <input id="gift-line" maxlength="80" placeholder="the thing only they should see">
  </div>
  <div class="row">
    <button type="button" class="ghost" id="cancel">Not yet</button>
    <button type="button" class="door" id="go">Walk out</button>
  </div>
  <script>
    var L = window.FdOfficeLoop;
    function readLog() {
      try { return L.parseJsonSafe(WA.state.loadVariable("gateA"), []); } catch (e) { return []; }
    }
    function readNotes() {
      try { return L.parseJsonSafe(WA.state.loadVariable("boardNotes"), []); } catch (e) { return []; }
    }
    WA.onInit().then(function () {
      var today = L.todayKey();
      if (WA.player.state.closeLine && WA.player.state.closedDay === today) {
        document.getElementById("line").value = WA.player.state.closeLine;
      }
      var names = L.closedTogether(readLog(), today);
      if (names.length) {
        document.getElementById("together").textContent = "Already closed today: " + names.join(", ");
      }
    });
    document.getElementById("cancel").onclick = function () { WA.ui.modal.closeModal(); };
    document.getElementById("go").onclick = function () {
      var line = L.clipLine(document.getElementById("line").value, 160);
      if (!line) { document.getElementById("line").focus(); return; }
      var day = L.todayKey();
      var gift = L.closeGift(
        WA.player.name || "Someone",
        document.getElementById("gift-to").value,
        document.getElementById("gift-line").value,
        day
      );
      if (gift) {
        try { WA.state.saveVariable("boardNotes", JSON.stringify(L.pinNote(readNotes(), gift))); } catch (e) {}
      }
      WA.player.state.saveVariable("closeLine", line, { public: true, persist: true });
      WA.player.state.saveVariable("closedDay", day, { public: false, persist: true });
      WA.player.state.saveVariable("left", true, { public: true, persist: true });
      WA.player.state.saveVariable("onNow", "", { public: true, persist: true });
      WA.player.state.saveVariable("scene", "", { public: true, persist: true });
      WA.player.state.saveVariable("next", "", { public: true, persist: true });
      WA.chat.sendChatMessage("door · " + line, "FD Office");
      WA.ui.modal.closeModal();
    };
  </script>
</body>
</html>
